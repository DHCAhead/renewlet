name: Sync upstream

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/zhiyingzzhou/renewlet.git
          git fetch upstream --tags

      - name: Merge upstream/main but keep local configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories || true

          git checkout --ours wrangler.jsonc
          find .github/workflows -type f ! -name "sync-upstream.yml" -delete

          git add wrangler.jsonc .github/workflows
          git commit --no-edit || echo "No merge commit needed"

      - name: Push changes
        run: |
          git push origin main
